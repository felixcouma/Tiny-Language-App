name: Deploy to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages on every push to the
# active branch. After the one-time setup (Settings → Pages → Source:
# "GitHub Actions"), every push gives you an updated public link.
on:
  push:
    branches: ['main']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional upgrades — set these as repo Variables (Settings → Secrets
          # and variables → Actions → Variables). Blank = device voice + Wikimedia.
          VITE_TTS_PROXY_URL: ${{ vars.VITE_TTS_PROXY_URL }}
          VITE_ELEVENLABS_VOICE: ${{ vars.VITE_ELEVENLABS_VOICE }}
          VITE_UNSPLASH_KEY: ${{ vars.VITE_UNSPLASH_KEY }}
          VITE_PEXELS_KEY: ${{ vars.VITE_PEXELS_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
